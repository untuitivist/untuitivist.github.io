    color: "#5EEAD4"
    orbitRadius: 4.5
    orbitTilt: [0.32, 0.0, 0.14]
    title:
      en: "Macro Truth"
      zh: "宏观真实"
    subtitle:
      en: "Embodied Systems & Humanoid Motion"
      zh: "具身系统与人形运动控制"
    thesis:
      en: "Grounding intelligence in multi-body dynamics, whole-body motion capture, reinforcement learning, and physical actuators."
      zh: "将智能锚定在多体动力学、全身动捕、强化学习策略与真实机器人执行器之中。"
  - id: "micro"
    color: "#F59E0B"
    orbitRadius: 3.35
    orbitTilt: [-0.46, 0.35, -0.22]
    title:
      en: "Micro Truth"
      zh: "微观真实"
    subtitle:
      en: "Physical Signals & Urban Perception"
      zh: "物理信号与视觉感知"
    thesis:
      en: "Extracting domain-invariant physical laws from high-frequency vibration spectra and real-world visual hazards."
      zh: "从高频振动频谱与真实城市视觉场景中提炼跨域不变的物理与结构规律。"
  - id: "social"
