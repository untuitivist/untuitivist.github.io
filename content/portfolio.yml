  - id: "llm-control-g1"
    code: "M-02"
    domain: "macro"
    stageType: "rerun"
    year: "2026"
    orbitAngle: 1.92
    title:
      en: "LLM Control G1"
      zh: "LLM Control G1"
    tagline:
      en: "Natural-language reasoning to whole-body Unitree G1 tabletop manipulation, inspectable live via Rerun Web Viewer."
      zh: "面向宇树 G1 的自然语言高层规划与仿真全身操作控制，内置真·Rerun Web 引擎交互回放。"
    summary:
      en: "Bridging LLM task decomposition with low-level humanoid whole-body control in simulation. Language instructions compile into structured manipulation sub-goals (approach, torso stabilization, bimanual reach, grasp, and basket placement) logged directly as Rerun (.rrd) streams for synchronized 3D kinematics, camera, and action-trace inspection in the browser."
      zh: "打通大语言模型任务分解与底层人形全身控制策略。自然语言指令被编译为可验证的仿真子目标序列（逼近、躯干平衡、伸臂抓取与放置），并原生输出 Rerun (.rrd) 空间日志，支持直接在浏览器中通过官方 Rerun Web Viewer 交互检查三维姿态与控制轨迹。"
    highlights:
      - label:
          en: "Pipeline"
          zh: "控制链路"
        value: "LLM Planner → G1 Whole-Body Sim"
      - label:
          en: "Inspection"
          zh: "空间回放"
        value: "Live @rerun-io/web-viewer (v0.44)"
      - label:
          en: "Compatibility"
          zh: "兼容范围"
        value: "RRD SDK v0.23 – v0.44"
      - label:
          en: "Recording"
          zh: "仿真视角"
        value: "MuJoCo Tabletop Manipulation"
    media:
      video: "./media/llm-g1-perspective.mp4"
      poster: "./media/llm-g1-poster.jpg"
      defaultLocalRrd: "./recordings/llm-g1-sim.rrd"
      sampleRrdUrl: "https://app.rerun.io/version/0.44.0/examples/structure_from_motion.rrd"
      secondarySampleRrdUrl: "https://app.rerun.io/version/0.44.0/examples/dna.rrd"
    links:
      - label:
          en: "GitHub Profile"
          zh: "GitHub 主页"
        url: "https://github.com/untuitivist"

  - id: "g1-retargeting"
    code: "M-03"
    domain: "macro"
    stageType: "retargeting"
    year: "2025"
    orbitAngle: 3.45
    title:
      en: "G1 Motion Retargeting"
      zh: "G1 动作重定向与实机追踪"
    tagline:
      en: "From monocular dance video to 3D human recovery, GMR retargeting, mjlab RL tracking, and real Unitree G1 execution."
      zh: "从单目舞蹈视频到人体动作重建、GMR 运动重定向、mjlab 强化学习全身追踪及宇树 G1 实机部署。"
    summary:
      en: "End-to-end human-to-humanoid motion imitation stack. Recovers kinematic human trajectories from RGB dance footage, retargets joint references onto the Unitree G1 kinematic tree via GMR, trains dynamic whole-body tracking policies in mjlab with domain randomization, and deploys agile expressive motion onto physical hardware."
      zh: "端到端人类到人形机器人动作模仿管线：从普通舞蹈视频恢复三维人体运动轨迹，通过 GMR 重定向至宇树 G1 运动学树，在 mjlab 中结合域随机化训练全身强化学习追踪策略，并完成敏捷表现力动作的实机部署。"
    highlights:
      - label:
          en: "Retargeting"
          zh: "重定向引擎"
        value: "RGB → Human Recovery → GMR"
      - label:
          en: "RL Engine"
          zh: "训练框架"
        value: "mjlab Whole-Body Tracking"
      - label:
          en: "Deployment"
          zh: "实机验证"
        value: "Sim-to-Real Unitree G1"
      - label:
          en: "Reel"
          zh: "演示时长"
        value: "00:48 Multi-Stage Pipeline"
    media:
      video: "./media/g1-motion.mp4"
      poster: "./media/g1-motion.webp"
    links:
      - label:
          en: "GitHub Profile"
          zh: "GitHub 仓库"
        url: "https://github.com/untuitivist"

  - id: "six-axis-arm"
    code: "M-04"
    domain: "macro"
    stageType: "arm3d"
    year: "2024"
    orbitAngle: 5.05
    title:
      en: "Six-Axis Robotic Arm"
      zh: "六轴串联机械臂系统"
    tagline:
      en: "Compact 6-DOF serial manipulator: mechanical design, DH forward/inverse kinematics, MATLAB control interface, and physical prototype."
      zh: "紧凑型六自由度串联机械臂：结构设计、DH 正逆运动学求解、MATLAB 控制界面与物理样机闭环。"
    summary:
      en: "Full-stack mechatronic build spanning CAD assembly, Denavit–Hartenberg kinematic modeling, analytical/numerical inverse kinematics, trajectory interpolation, MATLAB graphical control console, and physical hardware motion verification."
      zh: "从机械结构 CAD 设计、Denavit–Hartenberg 运动学建模、正逆运动学求解与轨迹规划，到 MATLAB 图形化控制界面与物理样机实测的完整机电一体化项目。"
    highlights:
