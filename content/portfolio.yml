  - id: "pcastnet"
    code: "P-01"
    domain: "micro"
    stageType: "spectral"
    year: "2025"
    orbitAngle: 1.05
    title:
      en: "PCASTNet"
      zh: "PCASTNet · 物理约束跨域故障诊断"
    tagline:
      en: "Physics-constrained adaptive style transfer (AdaSN) for cross-machine, small-sample intelligent fault diagnosis — IEEE TIM 2025."
      zh: "面向跨机器、小样本工业故障诊断的物理约束自适应风格迁移网络（AdaSN），发表于 IEEE TIM 2025。"
    summary:
      en: "Published in IEEE Transactions on Instrumentation and Measurement (2025). Introduces Adaptive Style Normalization (AdaSN) constrained by physical signal invariants so fault-discriminative harmonic features survive severe cross-machine domain shifts even with minimal target-domain samples."
      zh: "发表于仪器仪表领域顶刊 IEEE TIM 2025。提出受物理信号不变量约束的自适应风格归一化模块（AdaSN），在目标机器仅有极少标注样本的情况下，有效解耦工况风格偏移并保留故障诊断判别特征。"
    highlights:
      - label:
          en: "Venue"
          zh: "发表期刊"
        value: "IEEE TIM 2025"
      - label:
          en: "Mechanism"
          zh: "核心模块"
        value: "Physics-Constrained AdaSN"
      - label:
          en: "Regime"
          zh: "目标场景"
        value: "Cross-Machine Small-Sample"
      - label:
