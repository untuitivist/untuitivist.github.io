      en: "Turning research loops into composable CLI and MCP primitives that query, simulate, and filter collective market signals."
      zh: "将量化研究闭环抽象为可组合的 CLI 与 MCP 原语，自动化执行因子探索、回测仿真与筛选。"

works:
  - id: "robomocap"
    code: "M-01"
    domain: "macro"
    stageType: "robomocap"
    year: "2026"
    orbitAngle: 0.35
    title:
      en: "RoboMoCap"
      zh: "RoboMoCap"
    tagline:
      en: "200+ hours of egocentric vision paired with 120 Hz whole-body optical motion capture for humanoid learning."
      zh: "200+ 小时第一视角视觉与 120 Hz 全身光学动捕同步数据集，面向人形机器人学习。"
    summary:
      en: "Large-scale multimodal motion capture dataset built across BitRobot, Grounded Superintelligence, and NUS MAGIC Lab. Combines RoboCap (6 hardware-synced cameras + dual IMUs + magnetometer + audio), RoboWrist wrist sensing, and 53-marker 120 Hz NOKOV optical MoCap across 14 participants and 290+ locomotion & loco-manipulation actions — driving 29-DoF Unitree G1 retargeting and egocentric reconstruction benchmarks."
      zh: "联合 BitRobot、Grounded Superintelligence 与 NUS MAGIC Lab 构建的大规模多模态全身动捕数据集。融合 RoboCap 6 路硬件同步第一视角相机与双 IMU、RoboWrist 腕部传感以及 53 标记点 120 Hz NOKOV 光学动捕，覆盖 14 位采集者、290+ 移动与操作动作，支撑 29-DoF 宇树 G1 运动重定向与第一视角重建基准。"
    highlights:
      - label:
          en: "Scale"
          zh: "采集规模"
        value: "200+ hrs · 5TB+"
      - label:
          en: "Actions"
          zh: "动作覆盖"
        value: "290+ / 14 subjects"
      - label:
          en: "Sensors"
          zh: "同步传感"
        value: "6 Ego + 2 Wrist + 53-Marker 120Hz"
      - label:
          en: "Target"
          zh: "具身落点"
        value: "29-DoF Unitree G1"
    media:
      poster: "./media/robomocap/hero-poster.jpg"
      g1Video: "./media/robomocap/g1-D43.mp4"
      g1Poster: "./media/robomocap/g1-D43.jpg"
      bodyVideo: "./media/robomocap/body-tracking.mp4"
      bodyPoster: "./media/robomocap/body-tracking.jpg"
      robocapImg: "./media/robomocap/robocap-side.png"
      robowristImg: "./media/robomocap/robowrist.png"
      ego1: "./media/robomocap/ego-01.jpg"
      ego2: "./media/robomocap/ego-02.jpg"
    links:
      - label:
          en: "Project Homepage"
          zh: "项目主页"
