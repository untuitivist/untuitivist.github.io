          zh: "期刊全文"
        url: "https://software.publish.founderss.cn/thesisDetails?columnId=115985918&Fpath=home&index=0&lang=zh"
        primary: true

  - id: "wqb-cli"
    code: "S-01"
    domain: "social"
    stageType: "terminal"
    year: "2025"
    orbitAngle: 2.65
    title:
      en: "WorldQuant BRAIN · wqb_cli"
      zh: "WorldQuant BRAIN · wqb_cli"
    tagline:
      en: "Agent-native Python CLI and MCP server uniting WorldQuant BRAIN API access, alpha simulation, and systematic screening."
      zh: "面向 WorldQuant BRAIN 的 Agent-Native Python CLI 与 MCP 工具链，打通 API 访问、因子仿真与自动化筛选。"
    summary:
      en: "Bridges quantitative alpha research and modern LLM agents. Wraps WorldQuant BRAIN authentication, expression validation, batch simulation queuing, and Sharpe/fitness/turnover screening into clean terminal commands and Model Context Protocol (MCP) tools for reproducible autonomous research loops."
      zh: "将量化因子研究与现代大语言模型 Agent 深度融合。将 WorldQuant BRAIN 认证、表达式校验、批量仿真调度及夏普/适应度/换手率筛选封装为高可读性的 CLI 指令与 MCP 协议工具，让 AI 智能体直接驱动可复现的量化研究闭环。"
    highlights:
      - label:
          en: "Interface"
          zh: "协议形态"
