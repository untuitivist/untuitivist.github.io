  - id: "manhole-detection"
    code: "P-02"
    domain: "micro"
    stageType: "vision"
    year: "2025"
    orbitAngle: 4.18
    title:
      en: "Manhole Hazard Detection"
      zh: "城市井盖隐患大核卷积检测"
    tagline:
      en: "YOLOv10 enhanced with RepLKBlock large-kernel convolution (RBC module) for real-world urban road hazard perception."
      zh: "融合 RepLKBlock 大核卷积（RBC 模块）的 YOLOv10 城市井盖隐患检测架构与定制数据集，发表于《软件》2025。"
    summary:
      en: "Curated a domain-specific urban manhole hazard dataset covering broken, displaced, and uncovered covers under varying lighting and occlusion, and redesigned the YOLOv10 backbone with a re-parameterized large-kernel RBC module to expand effective receptive fields without sacrificing real-time inference speed."
      zh: "构建覆盖破损、移位、缺失等多类别的城市井盖隐患数据集，并在 YOLOv10 主干中引入基于 RepLKBlock 的重参数化大核卷积模块（RBC），在保持实时推理速度的同时显著扩大复杂街景下的有效感受野。"
    highlights:
      - label:
          en: "Venue"
          zh: "发表期刊"
        value: "Software (《软件》) 2025"
      - label:
          en: "Backbone"
          zh: "模型结构"
        value: "YOLOv10 + RepLKBlock (RBC)"
      - label:
          en: "Dataset"
          zh: "数据构建"
        value: "Multi-State Urban Road Hazards"
      - label:
          en: "Focus"
          zh: "关键增益"
        value: "Large Receptive Field · Real-Time"
