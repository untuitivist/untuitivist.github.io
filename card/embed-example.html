<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Card Embed Example</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17211b;
        background: #eef2ec;
      }

      body {
        margin: 0;
        padding: clamp(18px, 5vw, 56px);
      }

      main {
        max-width: 980px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(28px, 5vw, 48px);
        line-height: 1;
      }

      p {
        max-width: 680px;
        margin: 0 0 24px;
        color: #596860;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Embed example</h1>
      <p>
        This page uses the same helper script that another website can use to render the public
        profile card.
      </p>
      <div id="untuitivist-profile"></div>
      <script
        src="../assets/embed-profile.js"
        data-target="#untuitivist-profile"
        data-height="620">
      </script>
    </main>
  </body>
</html>
